<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Bookstore</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #222; }
      h1 { margin-bottom: 4px; }
      section { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 16px 0; }
      input { padding: 6px; margin: 4px 6px 4px 0; }
      button { padding: 6px 12px; cursor: pointer; margin-right: 6px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
      .msg { padding: 8px; border-radius: 6px; background: #eef6ff; }
      .err { background: #ffecec; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
