name: build-service (reusable)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        run: |
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/bookstore/${{ inputs.service }}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" services/${{ inputs.service }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push "$IMAGE"

  update-gitops:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Set up SSH (deploy key + pinned GitHub host key)
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gitops_key
          chmod 600 ~/.ssh/gitops_key
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          [ "$FP" = "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" ] || { echo "GitHub host key mismatch: $FP"; exit 1; }

      - name: Update image tag in gitops repo
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gitops_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          TAG="${GITHUB_SHA::7}"
          git clone --depth 1 git@github.com:gowdas1997/bookstore-gitops.git gitops
          cd gitops
          git config user.name "bookstore-ci"
          git config user.email "bookstore-ci@users.noreply.github.com"
          for i in 1 2 3; do
            sed -i "/bookstore\/${SERVICE}\$/{n;s/newTag: .*/newTag: ${TAG}/}" apps/kustomization.yaml
            if git diff --quiet; then echo "no change needed"; exit 0; fi
            git add apps/kustomization.yaml
            git commit -m "ci: ${SERVICE} -> ${TAG}"
            if git push origin main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
          done
          echo "push failed after 3 tries"; exit 1
