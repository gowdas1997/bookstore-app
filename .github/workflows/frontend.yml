name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: test -f dist/index.html

      - name: AWS credentials (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.FRONTEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload assets (long cache)
        run: >
          aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET }}/"
          --delete --exclude "index.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (no cache)
        run: >
          aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html"
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/" "/index.html"
