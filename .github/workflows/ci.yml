name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, book-service, order-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c.get(k) for k in ("sub", "aud", "iss", "repository", "ref")})
          PY

      - name: AWS credentials (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        run: |
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/bookstore/${{ matrix.service }}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" services/${{ matrix.service }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push "$IMAGE"
